<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Contacto · Ramón Gardella</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Montserrat:wght@500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #f5f2ea;
      --text-main: #0b1220;
      --text-soft: #334155;
      --text-muted: #64748b;
      --btn-main: #0f172a;
      --btn-hover: #000000;
      --border-soft: #c7d2fe;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: var(--bg-main);
      color: var(--text-soft);
      line-height: 1.6;
    }

    /* ---------- NAV ---------- */
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 16px 60px;
      background: rgba(240, 238, 232, 0.92);
      border-bottom: 1px solid #e5e7eb;
      z-index: 10;
    }

    .nav-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand strong {
      display: block;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .brand span {
      font-size: 0.7rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .nav-right a {
      color: var(--text-muted);
      text-decoration: none;
      margin-left: 24px;
      font-size: 0.75rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      position: relative;
      font-weight: 500;
    }

    .nav-right a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -4px;
      width: 0;
      height: 1px;
      background: var(--text-main);
      transition: 0.3s;
    }

    .nav-right a:hover {
      color: var(--text-main);
    }

    .nav-right a:hover::after {
      width: 100%;
    }

    /* ---------- LANG ---------- */
    .lang-overlay {
      position: fixed;
      top: 100px;
      right: 60px;
      display: flex;
      gap: 18px;
      font-family: 'Montserrat', sans-serif;
      z-index: 20;
    }

    .lang-overlay a {
      text-decoration: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      letter-spacing: 2px;
    }

    .lang-overlay a.active {
      color: var(--text-main);
      font-weight: 600;
    }

    /* ---------- MAIN ---------- */
    main {
      max-width: 760px;
      margin: auto;
      padding: 180px 40px 140px;
      text-align: center;
    }

    h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: 2.6rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 28px;
    }

    .intro {
      font-size: 1.3rem;
      margin-bottom: 60px;
      color: var(--text-soft);
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    input, textarea {
      width: 100%;
      padding: 18px 20px;
      font-size: 1rem;
      font-family: 'Inter', sans-serif;
      border-radius: 10px;
      border: 2px solid var(--border-soft);
      outline: none;
    }

    textarea {
      min-height: 160px;
      resize: vertical;
    }

    button {
      align-self: center;
      margin-top: 20px;
      padding: 20px 56px;
      background: var(--btn-main);
      color: white;
      font-size: 0.8rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
    }

    button:hover {
      background: var(--btn-hover);
      transform: translateY(-3px);
      box-shadow: 0 12px 26px rgba(0,0,0,0.35);
    }

    @media (max-width: 768px) {
      nav { padding: 16px 30px; }
      main { padding: 160px 25px 120px; }
      .lang-overlay { right: 30px; }
    }
  </style>
</head>

<body>

<nav>
  <div class="nav-top">
    <div class="brand">
      <strong>Ramón Gardella</strong>
      <span>Músico · Performer · Educador</span>
    </div>

     <div class="nav-right">
  <a href="#inicio">Inicio</a>
  <a href="#enfoque">Enfoque</a>
  <a href="./sobre-mi.html">Sobre mí</a>
  <a href="#trabajo">Propuesta</a>
  <a href="#para-mi">¿Es para mí?</a>
  <a href="./media.html">Media</a>
  <a href="./contacto.html">Contacto</a>
  </div>
</nav>
  
<div class="lang-overlay">
  <a href="./" class="active">ES</a>
  <a href="../en/">EN</a>
  <a href="../de/">DE</a>
</div>


<main>
  <h1>Contacto</h1>

  <p class="intro">
    Contame quién sos y en qué te puedo ayudar.<br>
    Te respondo a la brevedad.
  </p>

  <form action="mailto:gardellavia2878@gmail.com" method="post" enctype="text/plain">
    <input type="text" name="nombre" placeholder="Nombre" required>
    <input type="email" name="email" placeholder="Email" required>
    <textarea name="mensaje" placeholder="Mensaje" required></textarea>
    <button type="submit">Enviar</button>
  </form>
</main>

</body>
</html>
